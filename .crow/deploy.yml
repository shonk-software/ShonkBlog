when:
  - event: manual
  - branch: main
    event: push

depends_on:
  - build-and-release-image

steps:
  - name: Deploy
    image: docker.io/alpine/curl
    environment:
      GITOPS_WEBHOOK_SECRET:
        from_secret: gitops_webhook_secret
    commands:
      - apk add openssl
      - |
        SIGNATURE=$(printf '{"action":"published"}' | openssl dgst -sha256 -hmac "$GITOPS_WEBHOOK_SECRET" | cut -d ' ' -f2)
        curl -X POST https://gitops.say.software/redeploy-and-update/shonk-blog \
          -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
          -H "X-GitHub-Event: package" \
          -H "Content-Type: application/json" \
          -d '{"action":"published"}'
